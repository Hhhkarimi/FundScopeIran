name: Hourly fund refresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-fund-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build database-free snapshots
        env:
          FIPIRAN_BASE_URL: https://www.fipiran.com/services
          TSETMC_BASE_URL: https://cdn.tsetmc.com/api
          ALLOW_SOURCE_DEGRADATION: "true"
        run: npm run scrape:csv
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds-latest.csv data/funds-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh fund snapshots"
          git push
      - name: Upload latest CSV
        uses: actions/upload-artifact@v4
        with:
          name: funds-latest-${{ github.run_number }}
          path: data/funds-latest.csv
          retention-days: 7
