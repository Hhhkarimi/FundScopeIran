name: Daily verified fund crawl

on:
  schedule:
    - cron: "15 11 * * 0-3,6"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hourly-refresh.yml"
      - "lib/data-quality.ts"
      - "lib/file-store.ts"
      - "lib/sources/**"
      - "scripts/crawl-fundbase.ts"

permissions:
  contents: write

concurrency:
  group: fund-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify browser runtime
        run: google-chrome --version
      - name: Crawl and validate public real-data pages
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MIN_REAL_FUND_ROWS: "20"
          FORCE_HISTORY_ARCHIVE: "true"
        run: npm run crawl:fundbase
      - name: Run data and application tests
        run: npm test
      - name: Commit accepted snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds-latest.csv data/funds-latest.json data/manifest.json data/history data/raw
          git diff --cached --quiet && exit 0
          git commit -m "data: archive verified fund snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload verified snapshot
        uses: actions/upload-artifact@v4
        with:
          name: funds-latest-${{ github.run_number }}
          path: |
            data/funds-latest.csv
            data/funds-latest.json
            data/manifest.json
          retention-days: 7
