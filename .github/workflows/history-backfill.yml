name: Historical fund backfill

on:
  schedule:
    - cron: "33 17 * * 4"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/history-backfill.yml"
      - "scripts/backfill-files.ts"

permissions:
  contents: write

concurrency:
  group: fund-data-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Backfill real NAV and ETF price history
        env:
          FIPIRAN_BASE_URL: https://www.fipiran.com/services
          TSETMC_BASE_URL: https://cdn.tsetmc.com/api
          ALLOW_SOURCE_DEGRADATION: "true"
          BACKFILL_DAYS: "730"
        run: npm run backfill
      - name: Commit historical partitions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill verified fund history"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
